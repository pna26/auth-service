# CI/CD do auth-service: usa o pipeline reutilizável do repositório platform
# (build + testes, Trivy, imagem multi-arch no GHCR/ECR e deploy no EKS).
# Detalhes: https://pna26.github.io/platform/devops/ci-cd/
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  pipeline:
    uses: pna26/platform/.github/workflows/service.yaml@main
    with:
      service: auth
      image: auth-service
      maven-deps: "account auth"
      aws-region: ${{ vars.AWS_REGION }}
      eks-cluster: ${{ vars.EKS_CLUSTER }}
      k8s-namespace: ${{ vars.K8S_NAMESPACE || 'store' }}
    secrets: inherit
